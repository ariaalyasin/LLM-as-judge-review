name: Build LaTeX PDF

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find phases and build PDFs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in Phase_*/presentation; do
            echo "Building $dir"

            if [ -f "$dir/main.tex" ]; then
              docker run --rm \
                -v "$PWD":/workdir \
                -w "/workdir/$dir" \
                texlive/texlive \
                latexmk -pdf main.tex

              if git status --porcelain | grep -q "$dir.*\.pdf"; then
                git add "$dir"/*.pdf
                git commit -m "Update PDF for $dir [skip ci]" || true
              fi
            fi
          done

          git push