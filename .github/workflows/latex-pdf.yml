name: Build LaTeX PDF

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find phases and build PDFs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build all PDFs first
          for dir in Phase_*/presentation; do
            echo "Building $dir"

            if [ -f "$dir/main.tex" ]; then
              docker run --rm \
                -v "$PWD":/workdir \
                -w "/workdir/$dir" \
                texlive/texlive \
                latexmk -pdf main.tex
            fi
          done

          # Check for any PDF changes and commit them all at once
          if git status --porcelain | grep -q "Phase_.*/presentation/.*\.pdf"; then
            git add Phase_*/presentation/*.pdf
            git commit -m "Update PDFs for all phases [skip ci]" || true
            git push
          else
            echo "No PDF changes detected"
          fi